name: Clean and Optimize Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  contents: write

jobs:
  optimize-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Source if package.json Exists
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build
            if [ -d dist ]; then
              cp -r dist/* .
            fi
          fi

      - name: Remove Unwanted Files and Waste
        run: |
          rm -f robots.txt sitemap.xml
          find . -maxdepth 3 -name "*.map" -delete

      - name: Purge Tracking Elements
        run: |
          find . -maxdepth 4 -type f -name "*.html" | while read -r html_file; do
            sed -i '/googletagmanager\.com\/gtag\/js/d' "$html_file"
            sed -i '/window\.dataLayer/,/<\/script>/d' "$html_file"
            sed -i '/gtag(/d' "$html_file"
          done

      - name: Minify JS and HTML
        run: |
          find . -maxdepth 4 -type f -name "*.js" ! -path "./node_modules/*" | while read -r js_file; do
            npx terser "$js_file" --compress --mangle -o "$js_file"
          done

          find . -maxdepth 4 -type f -name "*.html" ! -path "./node_modules/*" | while read -r html_file; do
            npx html-minifier@4.0.0 \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-style-link-type-attributes \
              --minify-css true \
              --minify-js true \
              -o "$html_file" "$html_file"
          done

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: clean and minify html/js"
            git push
          fi
